# .github/workflows/main.yml
#
# Aevox Main Branch Pipeline
#
# Triggers: push to main
# Jobs:
#   build           — compiler matrix [gcc×2 + clang-linux×2] × [default-tests, release-tests], ctest
#   asan-test       — GCC 15, CMake asan-tests preset, ASan + UBSan, ctest
#   asan-test-clang — clang 21 (Linux), CMake asan-tests preset, ASan + UBSan, ctest
#   install-linux   — default library-only install + external consumer validation
#   install-windows — default library-only install + external consumer validation
#
# NOTE: No format-check or tidy jobs — those run only on PRs (pr.yml).
# Format and tidy violations are caught before merge; re-checking on main
# is redundant and wastes runner minutes.
#
# Cache strategy: lukka/run-vcpkg@v11 binary cache keyed on hash of vcpkg.json + compiler id + runner OS.
#   Separate cache namespaces for gcc and clang-linux to prevent ABI-incompatible
#   binary reuse between compilers (ADD §3.4).
# CMake: installed via system apt (Ubuntu 26.04 ships cmake 3.31+) on Linux.
# Supported platforms: Linux (GCC 15, clang 21) and Windows install validation.

name: ci-tests

on:
  push:
    branches: [main]

concurrency:
  group: main-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Build — compiler matrix (4 entries), ctest
  # GCC 15 and clang 21 on Linux (default and release presets).
  # Standard checkout (fetch-depth: 1) — no merge commit needed on main.
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.preset }}) — ${{ matrix.compiler.id }}
    runs-on: self-ubuntu26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # GCC 15 — Linux only
          - compiler: { cc: gcc-15, cxx: g++-15, id: gcc }
            preset: default-tests
          - compiler: { cc: gcc-15, cxx: g++-15, id: gcc }
            preset: release-tests
          # clang 21 — Linux
          - compiler: { cc: clang-21, cxx: clang++-21, id: clang-linux }
            preset: default-tests
          - compiler: { cc: clang-21, cxx: clang++-21, id: clang-linux }
            preset: release-tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install GCC 15, Ninja, and CMake
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-15 g++-15 ninja-build cmake
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-15 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-15 100
          echo "CC=${{ matrix.compiler.cc }}" >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.compiler.cxx }}" >> "$GITHUB_ENV"

      - name: Log compiler and CMake versions
        run: |
          "$CC" --version
          "$CXX" --version
          cmake --version

      - name: Set up vcpkg with binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'
          additionalCacheKey: ${{ matrix.compiler.id }}-${{ runner.os }}

      - name: Configure (${{ matrix.preset }} preset)
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER="$CXX"

      - name: Build (${{ matrix.preset }} preset)
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test (${{ matrix.preset }} preset)
        run: ctest --preset ${{ matrix.preset }}

  # ─────────────────────────────────────────────────────────────────────────────
  # ASan + UBSan — GCC 15, asan CMake preset
  # Standard checkout (fetch-depth: 1). Separate job because ASan and release
  # are mutually exclusive (ADD §3.9).
  # ─────────────────────────────────────────────────────────────────────────────
  asan-test:
    name: ASan + UBSan — Linux GCC 15
    runs-on: self-ubuntu26.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install GCC 15, Ninja, and build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-15 g++-15 ninja-build
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-15 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-15 100

      - name: Install CMake
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake

      - name: Log CMake version
        run: cmake --version

      - name: Set up vcpkg with binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'
          additionalCacheKey: gcc-Linux

      - name: Configure (asan-tests preset — ASan + UBSan)
        run: cmake --preset asan-tests -DCMAKE_CXX_COMPILER="$CXX"
        env:
          CC: gcc-15
          CXX: g++-15

      - name: Build (asan-tests preset)
        run: cmake --build --preset asan-tests

      - name: Test (asan-tests preset — ASan + UBSan)
        run: ctest --preset asan-tests

  # ─────────────────────────────────────────────────────────────────────────────
  # ASan + UBSan — clang 21 (Linux), asan CMake preset
  # Independent sanitizer pass that catches clang-specific UB and stricter
  # constexpr evaluation errors invisible to GCC (ADD §3.9).
  # ─────────────────────────────────────────────────────────────────────────────
  asan-test-clang:
    name: ASan + UBSan — Linux clang 21
    runs-on: self-ubuntu26.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Ninja and CMake (clang 21 expected pre-installed on runner)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ninja-build cmake

      - name: Log compiler and CMake versions
        run: |
          clang-21 --version
          clang++-21 --version
          cmake --version

      - name: Set up vcpkg with binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'
          additionalCacheKey: clang-linux-Linux

      - name: Configure (asan-tests preset — ASan + UBSan)
        run: cmake --preset asan-tests -DCMAKE_CXX_COMPILER="$CXX"
        env:
          CC: clang-21
          CXX: clang++-21

      - name: Build (asan-tests preset)
        run: cmake --build --preset asan-tests

      - name: Test (asan-tests preset — ASan + UBSan)
        run: ctest --preset asan-tests

  install-linux:
    name: Install Consumer — Linux
    runs-on: self-ubuntu26.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install GCC 15, Ninja, and CMake
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-15 g++-15 ninja-build cmake
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-15 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-15 100

      - name: Set up vcpkg with binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'
          additionalCacheKey: install-linux

      - name: Configure library-only release
        run: cmake --preset release -DCMAKE_CXX_COMPILER=g++-15

      - name: Build library-only release
        run: cmake --build --preset release

      - name: Install Aevox
        run: cmake --install build/release --prefix "$PWD/build/install/aevox"

      - name: Configure external consumer
        run: >
          cmake -S tests/smoke/install-consumer -B build/install-consumer -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DCMAKE_PREFIX_PATH="$PWD/build/install/aevox"
          -DCMAKE_CXX_COMPILER=g++-15

      - name: Build external consumer
        run: cmake --build build/install-consumer

      - name: Run external consumer
        run: ./build/install-consumer/aevox_install_consumer

  install-windows:
    name: Install Consumer — Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up vcpkg with binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'
          additionalCacheKey: install-windows

      - name: Configure library-only release
        run: cmake --preset windows-msvc

      - name: Build library-only release
        run: cmake --build --preset windows-msvc-release

      - name: Install Aevox
        run: cmake --install build/msvc --config Release --prefix "$PWD/build/install/aevox"

      - name: Configure external consumer
        run: >
          cmake -S tests/smoke/install-consumer -B build/install-consumer
          -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DCMAKE_PREFIX_PATH="$PWD/build/install/aevox"

      - name: Build external consumer
        run: cmake --build build/install-consumer --config Release

      - name: Run external consumer
        run: ./build/install-consumer/Release/aevox_install_consumer.exe
